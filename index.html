     <div class="clearfix grpelem" id="u34101-18" data-muse-uid="U34101" data-muse-type="txt_frame" data-IBE-flags="txtStyleSrc"><!-- content -->
      <p id="u34101-3"><span>Alfonso Kint</span> es un artista multimedia que destaca por su versatilidad como realizador audiovisual, editor de video, dibujante de storyboards, pintor, ilustrador y diseñador gráfico.</p>
      <p id="u34101-4">&nbsp;</p>
      <p id="u34101-8">Nace en Madrid en 1976. Desde su infancia se inclina hacia la vocación artística, por lo que decide estudiar en la Facultad de <span id="u34101-6">Bellas Artes</span>, especializándose en Imagen. Durante este periodo comienza a realizar sus primeros trabajos como ilustrador en una agencia de publicidad.</p>
      <p id="u34101-9">&nbsp;</p>
      <p class="ts-Estilo-de-v-nculo-azul" id="u34101-16"><span id="u34101-10">En 2001 se introduce en el sector audiovisual, trabajando en el departamento de arte. Tres años después dibuja </span>sus primeros <span id="u34101-12">storyboards</span> o guiones gráficos profesionales en diversas producciones. <span id="u34101-14">En 2008 comienza su carrera como director y realizador audiovisual. </span>Entre su filmografía podemos encontrar títulos como:</p>
     </div>
