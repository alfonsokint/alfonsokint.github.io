name: Deploy & Optimize Static Site

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]

jobs:
  optimize_and_deploy:
    name: Optimize top images and deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jpegoptim pngquant

      - name: Run image optimization script
        env:
          TOP_N: 5
        run: |
          ls -la
          chmod +x scripts/optimize_top_images.sh
          ./scripts/optimize_top_images.sh "$TOP_N"

      - name: Commit optimized images (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images || true
          if git diff --staged --quiet; then
            echo "No image changes to commit"
          else
            git commit -m "ci: optimize top images (lossless/minor lossy)"
            git push
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./
